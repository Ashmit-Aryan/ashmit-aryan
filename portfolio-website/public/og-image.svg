<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#0f141b"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="120" fill="url(#accentGrad)" fill-opacity="0.08"/>
  <circle cx="1100" cy="530" r="150" fill="url(#accentGrad)" fill-opacity="0.06"/>
  <circle cx="600" cy="315" r="200" fill="url(#accentGrad)" fill-opacity="0.03"/>
  
  <!-- Grid pattern -->
  <g stroke="#00d4aa" stroke-width="0.5" stroke-opacity="0.05">
    <rect x="0" y="0" width="1200" height="630" fill="none"/>
  </g>
  
  <!-- Main content -->
  <g transform="translate(600, 315)" text-anchor="middle">
    <!-- Logo -->
    <text x="0" y="-120" font-family="Space Grotesk, sans-serif" font-size="64" font-weight="700" fill="url(#textGrad)">AA</text>
    
    <!-- Name -->
    <text x="0" y="-40" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="600" fill="#f0f4f8">Ashmit Aryan</text>
    
    <!-- Title -->
    <text x="0" y="20" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="400" fill="#a8b3c4">Software Developer & Tech Community Leader</text>
    
    <!-- Tagline -->
    <text x="0" y="60" font-family="monospace" font-size="16" fill="#00d4aa">Building systems, leading communities, solving problems.</text>
    
    <!-- Stats -->
    <g transform="translate(0, 120)" font-family="monospace" font-size="14">
      <text x="-200" y="0" fill="#00d4aa" text-anchor="middle">15+</text>
      <text x="-200" y="22" fill="#6b7c93" text-anchor="middle" font-size="11">Projects</text>
      
      <text x="0" y="0" fill="#6366f1" text-anchor="middle">8+</text>
      <text x="0" y="22" fill="#6b7c93" text-anchor="middle" font-size="11">Hackathons</text>
      
      <text x="200" y="0" fill="#f472b6" text-anchor="middle">50+</text>
      <text x="200" y="22" fill="#6b7c93" text-anchor="middle" font-size="11">Contributions</text>
    </g>
    
    <!-- Tech tags -->
    <g transform="translate(0, 180)" font-family="monospace" font-size="12">
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="rgba(0, 212, 170, 0.15)" stroke="#00d4aa" stroke-width="1"/>
        <text x="40" y="19" fill="#00d4aa" text-anchor="middle">Rust</text>
      </g>
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="80" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
        <text x="40" y="19" fill="#6366f1" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(20, 0)">
        <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
        <text x="50" y="19" fill="#f472b6" text-anchor="middle">Systems</text>
      </g>
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="100" height="28" rx="14" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
        <text x="50" y="19" fill="#fbbf24" text-anchor="middle">DevOps</text>
      </g>
    </g>
    
    <!-- Links -->
    <g transform="translate(0, 240)" font-family="monospace" font-size="14" fill="#6b7c93">
      <text x="-150" y="0" text-anchor="middle">github.com/ashmitaryan</text>
      <text x="150" y="0" text-anchor="middle">linkedin.com/in/ashmitaryan</text>
    </g>
  </g>
</svg>