<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  
  <!-- Grid background -->
  <g stroke="#00d4aa" stroke-width="0.5" stroke-opacity="0.08">
    <path d="M0,0 L800,0" stroke-dasharray="20,20"/>
    <path d="M0,500 L800,500" stroke-dasharray="20,20"/>
    <path d="M0,0 L0,500" stroke-dasharray="20,20"/>
    <path d="M800,0 L800,500" stroke-dasharray="20,20"/>
  </g>
  
  <!-- Compiler pipeline diagram -->
  <g transform="translate(400, 250)">
    <!-- Lexer -->
    <g class="stage">
      <rect x="-320" y="-100" width="100" height="60" rx="8" fill="rgba(0, 212, 170, 0.15)" stroke="#00d4aa" stroke-width="2"/>
      <text x="-270" y="-65" font-family="monospace" font-size="12" fill="#00d4aa" text-anchor="middle">Lexer</text>
      <text x="-270" y="-48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">Tokenize</text>
    </g>
    
    <!-- Arrow -->
    <path d="M-220 -70 L-180 -70" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#00d4aa"/>
      </marker>
    </defs>
    
    <!-- Parser -->
    <g class="stage">
      <rect x="-160" y="-100" width="100" height="60" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="2"/>
      <text x="-110" y="-65" font-family="monospace" font-size="12" fill="#6366f1" text-anchor="middle">Parser</text>
      <text x="-110" y="-48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">AST Build</text>
    </g>
    
    <path d="M-60 -70 L-20 -70" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Semantic Analysis -->
    <g class="stage">
      <rect x="0" y="-100" width="100" height="60" rx="8" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="2"/>
      <text x="50" y="-65" font-family="monospace" font-size="12" fill="#f472b6" text-anchor="middle">Semantic</text>
      <text x="50" y="-48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">Type Check</text>
    </g>
    
    <path d="M160 -70 L200 -70" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Codegen -->
    <g class="stage">
      <rect x="220" y="-100" width="100" height="60" rx="8" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="2"/>
      <text x="270" y="-65" font-family="monospace" font-size="12" fill="#fbbf24" text-anchor="middle">Codegen</text>
      <text x="270" y="-48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">x86-64 ASM</text>
    </g>
    
    <!-- Source code snippet -->
    <rect x="-320" y="20" width="640" height="140" rx="8" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
    <text x="-300" y="50" font-family="monospace" font-size="12" fill="#00d4aa">int main() {</text>
    <text x="-280" y="72" font-family="monospace" font-size="12" fill="#a8b3c4">    int x = 42;</text>
    <text x="-280" y="94" font-family="monospace" font-size="12" fill="#a8b3c4">    return x * 2;</text>
    <text x="-300" y="116" font-family="monospace" font-size="12" fill="#00d4aa">}</text>
    <text x="-300" y="140" font-family="monospace" font-size="12" fill="#6366f1">    ▼</text>
    <text x="-280" y="140" font-family="monospace" font-size="12" fill="#6366f1">    ▼</text>
    <text x="-260" y="140" font-family="monospace" font-size="12" fill="#6366f1">    ▼</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">C Compiler</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">Lexer → Parser → AST → Codegen (x86-64)</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="200" y="460" width="70" height="22" rx="11" fill="rgba(0, 212, 170, 0.15)" stroke="#00d4aa" stroke-width="1"/>
    <text x="235" y="475" fill="#00d4aa" text-anchor="middle">C</text>
    
    <rect x="280" y="460" width="90" height="22" rx="11" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="325" y="475" fill="#6366f1" text-anchor="middle">x86-64</text>
    
    <rect x="380" y="460" width="70" height="22" rx="11" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
    <text x="415" y="475" fill="#f472b6" text-anchor="middle">AST</text>
    
    <rect x="460" y="460" width="80" height="22" rx="11" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="500" y="475" fill="#fbbf24" text-anchor="middle">Systems</text>
  </g>
</svg>