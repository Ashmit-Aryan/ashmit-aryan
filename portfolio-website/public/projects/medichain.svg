<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Medical cross background pattern -->
  <g fill="none" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.05">
    <path d="M400,0 L400,500 M0,250 L800,250"/>
    <path d="M200,150 L200,350 M100,250 L300,250 M600,150 L600,350 M500,250 L700,250"/>
  </g>
  
  <!-- Blockchain chain visualization -->
  <g transform="translate(400, 250)">
    <!-- Chain links -->
    <g stroke-width="3" fill="none">
      <!-- Link 1 -->
      <ellipse cx="-200" cy="0" rx="50" ry="30" stroke="#00d4aa" stroke-opacity="0.6"/>
      <ellipse cx="-200" cy="0" rx="35" ry="18" stroke="#00d4aa" stroke-opacity="0.3"/>
      <text x="-200" y="5" font-family="monospace" font-size="10" fill="#00d4aa" text-anchor="middle">Block #1</text>
      
      <!-- Link 2 -->
      <ellipse cx="-80" cy="0" rx="50" ry="30" stroke="#6366f1" stroke-opacity="0.6"/>
      <ellipse cx="-80" cy="0" rx="35" ry="18" stroke="#6366f1" stroke-opacity="0.3"/>
      <text x="-80" y="5" font-family="monospace" font-size="10" fill="#6366f1" text-anchor="middle">Block #2</text>
      
      <!-- Link 3 -->
      <ellipse cx="40" cy="0" rx="50" ry="30" stroke="#f472b6" stroke-opacity="0.6"/>
      <ellipse cx="40" cy="0" rx="35" ry="18" stroke="#f472b6" stroke-opacity="0.3"/>
      <text x="40" y="5" font-family="monospace" font-size="10" fill="#f472b6" text-anchor="middle">Block #3</text>
      
      <!-- Link 4 -->
      <ellipse cx="160" cy="0" rx="50" ry="30" stroke="#fbbf24" stroke-opacity="0.6"/>
      <ellipse cx="160" cy="0" rx="35" ry="18" stroke="#fbbf24" stroke-opacity="0.3"/>
      <text x="160" y="5" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Block #4</text>
      
      <!-- Link 5 -->
      <ellipse cx="280" cy="0" rx="50" ry="30" stroke="#00d4aa" stroke-opacity="0.6"/>
      <ellipse cx="280" cy="0" rx="35" ry="18" stroke="#00d4aa" stroke-opacity="0.3"/>
      <text x="280" y="5" font-family="monospace" font-size="10" fill="#00d4aa" text-anchor="middle">Block #5</text>
    </g>
    
    <!-- Connecting lines -->
    <path d="M-150,0 L-130,0" stroke="#00d4aa" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <path d="M-30,0 L-10,0" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <path d="M90,0 L110,0" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <path d="M210,0 L230,0" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#00d4aa"/>
      </marker>
    </defs>
    
    <!-- Zero-knowledge proof visualization -->
    <g transform="translate(0, 100)">
      <!-- Prover -->
      <rect x="-250" y="-40" width="120" height="80" rx="8" fill="rgba(0, 212, 170, 0.1)" stroke="#00d4aa" stroke-width="1"/>
      <text x="-190" y="-10" font-family="monospace" font-size="11" fill="#00d4aa" text-anchor="middle">Prover</text>
      <text x="-190" y="10" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Patient Data</text>
      <text x="-190" y="28" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">+ Private Key</text>
      
      <!-- Arrow -->
      <path d="M-130,0 L-80,0" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrow2)"/>
      <defs>
        <marker id="arrow2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#00d4aa"/>
        </marker>
      </defs>
      
      <!-- ZK Circuit -->
      <rect x="-70" y="-40" width="140" height="80" rx="8" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="1"/>
      <text x="0" y="-10" font-family="monospace" font-size="11" fill="#6366f1" text-anchor="middle">ZK Circuit</text>
      <text x="0" y="10" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Circom / Rust</text>
      <text x="0" y="28" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Proof Gen</text>
      
      <!-- Arrow -->
      <path d="M70,0 L120,0" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow3)"/>
      <defs>
        <marker id="arrow3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
        </marker>
      </defs>
      
      <!-- Verifier -->
      <rect x="130" y="-40" width="120" height="80" rx="8" fill="rgba(244, 114, 182, 0.1)" stroke="#f472b6" stroke-width="1"/>
      <text x="190" y="-10" font-family="monospace" font-size="11" fill="#f472b6" text-anchor="middle">Verifier</text>
      <text x="190" y="10" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Smart Contract</text>
      <text x="190" y="28" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Verify Proof</text>
      
      <!-- Arrow -->
      <path d="M250,0 L300,0" stroke="#f472b6" stroke-width="2" marker-end="url(#arrow4)"/>
      <defs>
        <marker id="arrow4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <path d="M0,0 L8,3 L0,6 Z" fill="#f472b6"/>
        </marker>
      </defs>
      
      <!-- Blockchain -->
      <rect x="310" y="-40" width="120" height="80" rx="8" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
      <text x="370" y="-10" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">Solana</text>
      <text x="370" y="10" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Immutable</text>
      <text x="370" y="28" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">Ledger</text>
    </g>
  </g>
  
  <!-- Medical icons -->
  <g font-family="monospace" font-size="24" fill="#00d4aa" opacity="0.15">
    <text x="100" y="100" transform="rotate(-15, 100, 100)">⚕</text>
    <text x="650" y="400" transform="rotate(15, 650, 400)">🔒</text>
    <text x="150" y="420" transform="rotate(10, 150, 420)">📋</text>
    <text x="600" y="80" transform="rotate(-10, 600, 80)">⛓</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">MediChain</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">ZK-Proof Medical Records on Solana</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="180" y="460" width="60" height="22" rx="11" fill="rgba(222, 165, 132, 0.15)" stroke="#dea584" stroke-width="1"/>
    <text x="210" y="475" fill="#dea584" text-anchor="middle">Rust</text>
    
    <rect x="250" y="460" width="70" height="22" rx="11" fill="rgba(0, 212, 170, 0.15)" stroke="#00d4aa" stroke-width="1"/>
    <text x="285" y="475" fill="#00d4aa" text-anchor="middle">Solana</text>
    
    <rect x="330" y="460" width="70" height="22" rx="11" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="365" y="475" fill="#6366f1" text-anchor="middle">ZK-Proofs</text>
    
    <rect x="410" y="460" width="60" height="22" rx="11" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
    <text x="440" y="475" fill="#f472b6" text-anchor="middle">IPFS</text>
    
    <rect x="480" y="460" width="70" height="22" rx="11" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="515" y="475" fill="#fbbf24" text-anchor="middle">Hackathon</text>
  </g>
</svg>