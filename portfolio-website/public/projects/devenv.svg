<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  
  <!-- Terminal window -->
  <g transform="translate(50, 50)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="700" height="400" rx="8" fill="#1a1e26" stroke="#333" stroke-width="1"/>
    <rect x="0" y="0" width="700" height="40" rx="8 8 0 0" fill="#1e222a" stroke="#333" stroke-width="1"/>
    <circle cx="18" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#28ca42"/>
    <text x="100" y="26" font-family="monospace" font-size="12" fill="#6b7c93">~/projects ➜ devenv</text>
    
    <!-- Help output -->
    <g font-family="monospace" font-size="11" transform="translate(20, 60)" fill="#f8f8f2">
      <text x="0" y="0"><tspan fill="#50fa7b">devenv</tspan> - Developer Environment Manager</text>
      <text x="0" y="25" fill="#6272a4">Version: 1.2.0 | Rust 1.75 | WASM Plugin System</text>
      <text x="0" y="50" fill="#6272a4">──────────────────────────────────────────────</text>
      
      <text x="0" y="80"><tspan fill="#bd93f9">USAGE:</tspan></text>
      <text x="20" y="105"><tspan fill="#f8f8f2">devenv </tspan><tspan fill="#50fa7b"><COMMAND></tspan></text>
      <text x="20" y="130"><tspan fill="#f8f8f2">devenv </tspan><tspan fill="#ff79c6">[OPTIONS]</tspan></text>
      
      <text x="0" y="160"><tspan fill="#bd93f9">COMMANDS:</tspan></text>
      <text x="20" y="185"><tspan fill="#50fa7b">init</tspan>       <tspan fill="#6272a4">Initialize new project environment</tspan></text>
      <text x="20" y="210"><tspan fill="#50fa7b">sync</tspan>       <tspan fill="#6272a4">Sync dotfiles & configs across machines</tspan></text>
      <text x="20" y="235"><tspan fill="#50fa7b">install</tspan>    <tspan fill="#6272a4">Install language versions (rust, node, python, go)</tspan></text>
      <text x="20" y="260"><tspan fill="#50fa7b">switch</tspan>     <tspan fill="#6272a4">Switch between project environments</tspan></text>
      <text x="20" y="285"><tspan fill="#50fa7b">plugin</tspan>     <tspan fill="#6272a4">Manage WASM plugins</tspan></text>
      <text x="20" y="310"><tspan fill="#50fa7b">doctor</tspan>     <tspan fill="#6272a4">Diagnose environment issues</tspan></text>
      <text x="20" y="335"><tspan fill="#50fa7b">completion</tspan> <tspan fill="#6272a4">Generate shell completions</tspan></text>
      
      <text x="0" y="365"><tspan fill="#bd93f9">OPTIONS:</tspan></text>
      <text x="20" y="390"><tspan fill="#ff79c6">-c, --config </tspan><tspan fill="#50fa7b"><PATH></tspan>    <tspan fill="#6272a4">Config file path</tspan></text>
      <text x="20" y="415"><tspan fill="#ff79c6">-v, --verbose</tspan>                 <tspan fill="#6272a4">Enable verbose output</tspan></text>
      <text x="20" y="440"><tspan fill="#ff79c6">--no-color</tspan>                     <tspan fill="#6272a4">Disable colored output</tspan></text>
      <text x="20" y="465"><tspan fill="#ff79c6">-h, --help</tspan>                     <tspan fill="#6272a4">Print help</tspan></text>
    </g>
  </g>
  
  <!-- Plugin system visualization -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#f472b6">Plugin Architecture (WASM):</text>
    <text x="20" y="20" font-family="monospace" font-size="10" fill="#a8b3c4">├── core (Rust)</text>
    <text x="40" y="38" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── config.rs</text>
    <text x="40" y="56" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── env_manager.rs</text>
    <text x="40" y="74" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── dotfiles.rs</text>
    <text x="40" y="92" font-family="monospace" font-size="10" fill="#a8b3c4">│   └── wasm_runtime.rs</text>
    <text x="20" y="110" font-family="monospace" font-size="10" fill="#a8b3c4">├── plugins/</text>
    <text x="40" y="128" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── rust-toolchain.wasm</text>
    <text x="40" y="146" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── node-version.wasm</text>
    <text x="40" y="164" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── python-venv.wasm</text>
    <text x="40" y="182" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── go-modules.wasm</text>
    <text x="40" y="200" font-family="monospace" font-size="10" fill="#a8b3c4">│   └── custom.wasm (user)</text>
  </g>
  
  <!-- Cross-platform indicators -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="rgba(222, 165, 132, 0.08)" stroke="#dea584" stroke-width="1"/>
    <text x="150" y="25" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#dea584" text-anchor="middle">Cross-Platform</text>
    
    <g font-family="monospace" font-size="12" text-anchor="middle">
      <g transform="translate(50, 60)">
        <text x="0" y="0" font-size="32" fill="#dea584">🐧</text>
        <text x="0" y="30" font-size="10" fill="#a8b3c4">Linux</text>
        <text x="0" y="45" font-size="9" fill="#6b7c93">Native</text>
      </g>
      <g transform="translate(150, 60)">
        <text x="0" y="0" font-size="32" fill="#dea584">🍎</text>
        <text x="0" y="30" font-size="10" fill="#a8b3c4">macOS</text>
        <text x="0" y="45" font-size="9" fill="#6b7c93">Native (ARM64/x64)</text>
      </g>
      <g transform="translate(250, 60)">
        <text x="0" y="0" font-size="32" fill="#dea584">🪟</text>
        <text x="0" y="30" font-size="10" fill="#a8b3c4">Windows</text>
        <text x="0" y="45" font-size="9" fill="#6b7c93">WSL2 / Native</text>
      </g>
    </g>
  </g>
  
  <!-- WASM Runtime demo -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="300" height="150" rx="8" fill="rgba(99, 102, 241, 0.08)" stroke="#6366f1" stroke-width="1"/>
    <text x="150" y="25" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">WASM Runtime</text>
    
    <g font-family="monospace" font-size="10" transform="translate(20, 50)" fill="#f8f8f2">
      <text x="0" y="0"><tspan fill="#bd93f9">$</tspan> devenv plugin run rust-toolchain</text>
      <text x="0" y="25"><tspan fill="#6272a4">→</tspan> Loading WASM module...</text>
      <text x="0" y="50"><tspan fill="#50fa7b">✓</tspan> Module loaded (2.3ms)</text>
      <text x="0" y="75"><tspan fill="#6272a4">→</tspan> Checking rustup availability...</text>
      <text x="0" y="100"><tspan fill="#50fa7b">✓</tspan> rustc 1.75.0 installed</text>
      <text x="0" y="125"><tspan fill="#ff79c6">$</tspan> cargo --version</text>
      <text x="0" y="150"><tspan fill="#50fa7b">cargo 1.75.0</tspan></text>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">DevEnv</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">Cross-platform CLI with WASM Plugin System</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="150" y="460" width="70" height="22" rx="11" fill="rgba(222, 165, 132, 0.15)" stroke="#dea584" stroke-width="1"/>
    <text x="185" y="475" fill="#dea584" text-anchor="middle">Rust</text>
    
    <rect x="230" y="460" width="60" height="22" rx="11" fill="rgba(107, 114, 228, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="260" y="475" fill="#6366f1" text-anchor="middle">WASM</text>
    
    <rect x="300" y="460" width="100" height="22" rx="11" fill="rgba(107, 114, 228, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="350" y="475" fill="#6366f1" text-anchor="middle">Cross-platform</text>
    
    <rect x="410" y="460" width="100" height="22" rx="11" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
    <text x="460" y="475" fill="#f472b6" text-anchor="middle">Plugin System</text>
    
    <rect x="520" y="460" width="70" height="22" rx="11" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="555" y="475" fill="#fbbf24" text-anchor="middle">CLI Tool</text>
  </g>
</svg>