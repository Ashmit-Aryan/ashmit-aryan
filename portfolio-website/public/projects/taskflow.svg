<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Kanban Board -->
  <g transform="translate(50, 80)">
    <!-- Column 1: Backlog -->
    <g class="column">
      <rect x="0" y="0" width="170" height="380" rx="12" fill="rgba(0, 212, 170, 0.08)" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="30" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#00d4aa" text-anchor="middle">BACKLOG</text>
      <text x="85" y="48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">3 tasks</text>
      
      <!-- Task cards -->
      <g font-family="monospace" font-size="9" fill="#a8b3c4">
        <rect x="12" y="65" width="146" height="50" rx="6" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="82" font-size="9" fill="#f0f4f8">Fix auth token</text>
        <text x="20" y="96" font-size="8" fill="#6b7c93">#142 • 🐛</text>
        <rect x="20" y="104" width="40" height="6" rx="3" fill="#ef4444" stroke-width="0"/>
        
        <rect x="12" y="130" width="146" height="50" rx="6" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="147" font-size="9" fill="#f0f4f8">Add dark mode</text>
        <text x="20" y="161" font-size="8" fill="#6b7c93">#138 • ✨</text>
        <rect x="20" y="169" width="40" height="6" rx="3" fill="#6366f1" stroke-width="0"/>
        
        <rect x="12" y="195" width="146" height="50" rx="6" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="212" font-size="9" fill="#f0f4f8">Update deps</text>
        <text x="20" y="226" font-size="8" fill="#6b7c93">#135 • 📦</text>
        <rect x="20" y="234" width="40" height="6" rx="3" fill="#fbbf24" stroke-width="0"/>
      </g>
    </g>
    
    <!-- Column 2: Todo -->
    <g class="column" transform="translate(190, 0)">
      <rect x="0" y="0" width="170" height="380" rx="12" fill="rgba(99, 102, 241, 0.08)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="30" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">TODO</text>
      <text x="85" y="48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">2 tasks</text>
      
      <g font-family="monospace" font-size="9" fill="#a8b3c4">
        <rect x="12" y="65" width="146" height="50" rx="6" fill="#0f141b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="82" font-size="9" fill="#f0f4f8">WebSocket sync</text>
        <text x="20" y="96" font-size="8" fill="#6b7c93">#140 • 🔌</text>
        <rect x="20" y="104" width="40" height="6" rx="3" fill="#6366f1" stroke-width="0"/>
        
        <rect x="12" y="130" width="146" height="50" rx="6" fill="#0f141b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="147" font-size="9" fill="#f0f4f8">CRDT merge</text>
        <text x="20" y="161" font-size="8" fill="#6b7c93">#139 • 🧬</text>
        <rect x="20" y="169" width="40" height="6" rx="3" fill="#f472b6" stroke-width="0"/>
      </g>
    </g>
    
    <!-- Column 3: In Progress -->
    <g class="column" transform="translate(380, 0)">
      <rect x="0" y="0" width="170" height="380" rx="12" fill="rgba(251, 191, 36, 0.08)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="30" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">IN PROGRESS</text>
      <text x="85" y="48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">2 tasks</text>
      
      <g font-family="monospace" font-size="9" fill="#a8b3c4">
        <rect x="12" y="65" width="146" height="50" rx="6" fill="#0f141b" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="82" font-size="9" fill="#f0f4f8">Real-time cursors</text>
        <text x="20" y="96" font-size="8" fill="#6b7c93">#141 • 👥</text>
        <rect x="20" y="104" width="40" height="6" rx="3" fill="#fbbf24" stroke-width="0"/>
        <!-- Activity indicator -->
        <circle cx="145" cy="85" r="4" fill="#00d4aa">
          <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
        </circle>
        
        <rect x="12" y="130" width="146" height="50" rx="6" fill="#0f141b" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="147" font-size="9" fill="#f0f4f8">Offline queue</text>
        <text x="20" y="161" font-size="8" fill="#6b7c93">#137 • 📱</text>
        <rect x="20" y="169" width="40" height="6" rx="3" fill="#fbbf24" stroke-width="0"/>
        <circle cx="145" cy="150" r="4" fill="#00d4aa">
          <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    
    <!-- Column 4: Review -->
    <g class="column" transform="translate(570, 0)">
      <rect x="0" y="0" width="170" height="380" rx="12" fill="rgba(244, 114, 182, 0.08)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3"/>
      <text x="85" y="30" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">REVIEW</text>
      <text x="85" y="48" font-family="monospace" font-size="10" fill="#6b7c93" text-anchor="middle">1 task</text>
      
      <g font-family="monospace" font-size="9" fill="#a8b3c4">
        <rect x="12" y="65" width="146" height="50" rx="6" fill="#0f141b" stroke="#f472b6" stroke-width="1" stroke-opacity="0.3"/>
        <text x="20" y="82" font-size="9" fill="#f0f4f8">PR #143 review</text>
        <text x="20" y="96" font-size="8" fill="#6b7c93">@reviewer • 👀</text>
        <rect x="20" y="104" width="40" height="6" rx="3" fill="#f472b6" stroke-width="0"/>
      </g>
    </g>
  </g>
  
  <!-- Real-time collaboration indicators -->
  <g transform="translate(50, 480)">
    <circle cx="20" cy="10" r="8" fill="#00d4aa" stroke="#0f141b" stroke-width="2">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="10" r="8" fill="#6366f1" stroke="#0f141b" stroke-width="2">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="56" cy="10" r="8" fill="#f472b6" stroke="#0f141b" stroke-width="2">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text x="80" y="15" font-family="monospace" font-size="10" fill="#6b7c93">3 collaborators online</text>
    
    <!-- WebSocket indicator -->
    <circle cx="600" cy="10" r="6" fill="#00d4aa">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="615" y="15" font-family="monospace" font-size="10" fill="#00d4aa">WebSocket ● Connected</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">TaskFlow</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">Real-time Kanban with CRDTs & WebSockets</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="180" y="460" width="80" height="22" rx="11" fill="rgba(0, 150, 136, 0.15)" stroke="#009688" stroke-width="1"/>
    <text x="220" y="475" fill="#009688" text-anchor="middle">FastAPI</text>
    
    <rect x="270" y="460" width="60" height="22" rx="11" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="300" y="475" fill="#6366f1" text-anchor="middle">React</text>
    
    <rect x="340" y="460" width="90" height="22" rx="11" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
    <text x="385" y="475" fill="#f472b6" text-anchor="middle">WebSockets</text>
    
    <rect x="440" y="460" width="70" height="22" rx="11" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1"/>
    <text x="475" y="475" fill="#fbbf24" text-anchor="middle">CRDTs</text>
    
    <rect x="520" y="460" width="70" height="22" rx="11" fill="rgba(222, 165, 132, 0.15)" stroke="#dea584" stroke-width="1"/>
    <text x="555" y="475" fill="#dea584" text-anchor="middle">Rust</text>
  </g>
</svg>