<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  
  <!-- Terminal/Code editor aesthetic -->
  <g transform="translate(50, 80)">
    <!-- Terminal header -->
    <rect x="0" y="0" width="700" height="40" rx="8 8 0 0" fill="#1a1e26" stroke="#333" stroke-width="1"/>
    <circle cx="18" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#28ca42"/>
    <text x="100" y="26" font-family="monospace" font-size="12" fill="#6b7c93">fastapi-boilerplate » main.py</text>
    
    <!-- Code content -->
    <rect x="0" y="40" width="700" height="350" rx="0 0 8 8" fill="#0d1117" stroke="#333" stroke-width="1"/>
    
    <g font-family="monospace" font-size="11" transform="translate(20, 70)">
      <!-- Imports -->
      <text x="0" y="0" fill="#ff79c6">from</text>
      <text x="50" y="0" fill="#f8f8f2"> fastapi </text>
      <text x="125" y="0" fill="#ff79c6">import</text>
      <text x="185" y="0" fill="#f8f8f2"> FastAPI, Depends</text>
      
      <text x="0" y="22" fill="#ff79c6">from</text>
      <text x="50" y="22" fill="#f8f8f2"> sqlalchemy.ext.asyncio </text>
      <text x="225" y="22" fill="#ff79c6">import</text>
      <text x="285" y="22" fill="#f8f8f2"> AsyncSession</text>
      
      <text x="0" y="44" fill="#ff79c6">from</text>
      <text x="50" y="44" fill="#f8f8f2"> .database </text>
      <text x="115" y="44" fill="#ff79c6">import</text>
      <text x="175" y="44" fill="#f8f8f2"> get_db</text>
      
      <text x="0" y="66" fill="#ff79c6">from</text>
      <text x="50" y="66" fill="#f8f8f2"> .schemas </text>
      <text x="115" y="66" fill="#ff79c6">import</text>
      <text x="175" y="66" fill="#f8f8f2"> UserCreate, UserResponse</text>
      
      <text x="0" y="88" fill="#ff79c6">from</text>
      <text x="50" y="88" fill="#f8f8f2"> .auth </text>
      <text x="115" y="88" fill="#ff79c6">import</text>
      <text x="175" y="88" fill="#f8f8f2"> create_access_token, get_current_user</text>
      
      <!-- Empty line -->
      
      <!-- App initialization -->
      <text x="0" y="132" fill="#f8f8f2">app = FastAPI(</text>
      <text x="20" y="154" fill="#f8f8f2">    title="FastAPI Boilerplate",</text>
      <text x="20" y="176" fill="#f8f8f2">    description="Production-ready API template",</text>
      <text x="20" y="198" fill="#f8f8f2">    version="1.0.0",</text>
      <text x="20" y="220" fill="#f8f8f2">    docs_url="/docs",</text>
      <text x="20" y="242" fill="#f8f8f2">    redoc_url="/redoc",</text>
      <text x="0" y="264" fill="#f8f8f2">)</text>
      
      <!-- Middleware -->
      <text x="0" y="286" fill="#6272a4"># Middleware</text>
      <text x="0" y="308" fill="#f8f8f2">app.add_middleware(</text>
      <text x="20" y="330" fill="#f8f8f2">    CORSMiddleware,</text>
      <text x="20" y="352" fill="#f8f8f2">    allow_origins=["*"],</text>
      <text x="20" y="374" fill="#f8f8f2">    allow_credentials=True,</text>
      <text x="20" y="396" fill="#f8f8f2">    allow_methods=["*"],</text>
      <text x="20" y="418" fill="#f8f8f2">    allow_headers=["*"],</text>
      <text x="0" y="440" fill="#f8f8f2">)</text>
      
      <!-- Routes -->
      <text x="0" y="462" fill="#6272a4"># Health check</text>
      <text x="0" y="484" fill="#bd93f9">@app.get</text>
      <text x="80" y="484" fill="#f8f8f2">("/health")</text>
      <text x="0" y="506" fill="#8be9fd">async def</text>
      <text x="85" y="506" fill="#50fa7b"> health_check</text>
      <text x="185" y="506" fill="#f8f8f2">():</text>
      <text x="20" y="528" fill="#f8f8f2">    return {"status": "ok"}</text>
    </g>
  </g>
  
  <!-- Project structure tree -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#6366f1">Project Structure:</text>
    <text x="20" y="20" font-family="monospace" font-size="10" fill="#a8b3c4">├── app/</text>
    <text x="40" y="38" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── api/</text>
    <text x="60" y="56" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   ├── v1/</text>
    <text x="80" y="74" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   │   ├── routes/</text>
    <text x="100" y="92" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   │   └── deps.py</text>
    <text x="60" y="110" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── core/</text>
    <text x="80" y="128" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   ├── config.py</text>
    <text x="80" y="146" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   ├── security.py</text>
    <text x="80" y="164" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   └── exceptions.py</text>
    <text x="40" y="182" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── db/</text>
    <text x="60" y="200" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   ├── session.py</text>
    <text x="60" y="218" font-family="monospace" font-size="10" fill="#a8b3c4">│   │   └── base.py</text>
    <text x="40" y="236" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── models/</text>
    <text x="40" y="254" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── schemas/</text>
    <text x="40" y="272" font-family="monospace" font-size="10" fill="#a8b3c4">│   └── main.py</text>
    <text x="20" y="290" font-family="monospace" font-size="10" fill="#a8b3c4">├── tests/</text>
    <text x="40" y="308" font-family="monospace" font-size="10" fill="#a8b3c4">│   ├── conftest.py</text>
    <text x="40" y="326" font-family="monospace" font-size="10" fill="#a8b3c4">│   └── test_*.py</text>
    <text x="20" y="344" font-family="monospace" font-size="10" fill="#a8b3c4">├── alembic/</text>
    <text x="20" y="362" font-family="monospace" font-size="10" fill="#a8b3c4">├── Dockerfile</text>
    <text x="20" y="380" font-family="monospace" font-size="10" fill="#a8b3c4">├── docker-compose.yml</text>
    <text x="20" y="398" font-family="monospace" font-size="10" fill="#a8b3c4">├── pyproject.toml</text>
    <text x="20" y="416" font-family="monospace" font-size="10" fill="#a8b3c4">└── .github/workflows/</text>
  </g>
  
  <!-- CI/CD Badge row -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="rgba(0, 212, 170, 0.08)" stroke="#00d4aa" stroke-width="1"/>
    <text x="100" y="25" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#00d4aa" text-anchor="middle">CI/CD Pipeline</text>
    
    <g font-family="monospace" font-size="10" text-anchor="middle">
      <!-- GitHub Actions -->
      <rect x="20" y="45" width="160" height="28" rx="4" fill="#2088ff" stroke-width="0"/>
      <text x="100" y="63" fill="#fff">GitHub Actions</text>
      
      <rect x="20" y="85" width="160" height="28" rx="4" fill="#00d4aa" stroke-width="0"/>
      <text x="100" y="103" fill="#0a0e14">Tests (pytest)</text>
      
      <rect x="20" y="125" width="160" height="28" rx="4" fill="#6366f1" stroke-width="0"/>
      <text x="100" y="143" fill="#fff">Type Check (mypy)</text>
      
      <rect x="20" y="165" width="160" height="28" rx="4" fill="#f472b6" stroke-width="0"/>
      <text x="100" y="183" fill="#fff">Lint (ruff)</text>
    </g>
  </g>
  
  <!-- Docker badge -->
  <g transform="translate(550, 300)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="rgba(36, 150, 237, 0.08)" stroke="#2496ed" stroke-width="1"/>
    <text x="100" y="25" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="600" fill="#2496ed" text-anchor="middle">Docker Ready</text>
    <text x="100" y="55" font-family="monospace" font-size="9" fill="#a8b3c4" text-anchor="middle">Multi-stage build</text>
    <text x="100" y="72" font-family="monospace" font-size="9" fill="#a8b3c4" text-anchor="middle">~45MB final image</text>
    <text x="100" y="89" font-family="monospace" font-size="9" fill="#a8b3c4" text-anchor="middle">Non-root user</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">FastAPI Boilerplate</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">Production-ready API with Auth, DB, Tests & CI/CD</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="180" y="460" width="80" height="22" rx="11" fill="rgba(0, 150, 136, 0.15)" stroke="#009688" stroke-width="1"/>
    <text x="220" y="475" fill="#009688" text-anchor="middle">FastAPI</text>
    
    <rect x="270" y="460" width="110" height="22" rx="11" fill="rgba(65, 105, 225, 0.15)" stroke="#4169e1" stroke-width="1"/>
    <text x="325" y="475" fill="#4169e1" text-anchor="middle">PostgreSQL</text>
    
    <rect x="390" y="460" width="90" height="22" rx="11" fill="rgba(220, 56, 45, 0.15)" stroke="#dc382d" stroke-width="1"/>
    <text x="435" y="475" fill="#dc382d" text-anchor="middle">SQLAlchemy</text>
    
    <rect x="490" y="460" width="80" height="22" rx="11" fill="rgba(36, 150, 237, 0.15)" stroke="#2496ed" stroke-width="1"/>
    <text x="530" y="475" fill="#2496ed" text-anchor="middle">Docker</text>
    
    <rect x="580" y="460" width="90" height="22" rx="11" fill="rgba(107, 114, 228, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="625" y="475" fill="#6366f1" text-anchor="middle">GitHub Actions</text>
  </g>
</svg>