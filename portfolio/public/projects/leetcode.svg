<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#151c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg6)"/>
  
  <!-- Grid pattern for algorithm visualization -->
  <g stroke="#00d4aa" stroke-width="0.5" stroke-opacity="0.04">
    <path d="M0,0 L800,0" stroke-dasharray="20,20"/>
    <path d="M0,500 L800,500" stroke-dasharray="20,20"/>
    <path d="M0,0 L0,500" stroke-dasharray="20,20"/>
    <path d="M800,0 L800,500" stroke-dasharray="20,20"/>
  </g>
  
  <!-- Pattern cards -->
  <g transform="translate(50, 60)">
    <!-- Sliding Window -->
    <g class="pattern-card">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(0, 212, 170, 0.1)" stroke="#00d4aa" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#00d4aa" text-anchor="middle">Sliding Window</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">15 problems</text>
      
      <!-- Visualization -->
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="200" height="40" rx="4" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
        <!-- Array elements -->
        <g font-family="monospace" font-size="11" fill="#f8f8f2">
          <text x="10" y="26">[1, 3, -1, -3, 5, 3, 6, 7]</text>
        </g>
        <!-- Window highlight -->
        <rect x="45" y="2" width="80" height="36" rx="4" fill="rgba(0, 212, 170, 0.2)" stroke="#00d4aa" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="85" y="26" font-family="monospace" font-size="11" fill="#00d4aa" font-weight="bold">k=3</text>
      </g>
      
      <!-- Code snippet -->
      <g font-family="monospace" font-size="9" transform="translate(15, 115)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">maxSlidingWindow</tspan>(nums, k):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># O(n) deque solution</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">return</tspan> <tspan fill="#f8f8f2">result</tspan></text>
      </g>
    </g>
    
    <!-- Two Pointers -->
    <g class="pattern-card" transform="translate(260, 0)">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">Two Pointers</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">18 problems</text>
      
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="200" height="40" rx="4" fill="#0f141b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
        <g font-family="monospace" font-size="11" fill="#f8f8f2">
          <text x="10" y="26">[-4,-1,0,1,2]  target=0</text>
        </g>
        <!-- Left pointer -->
        <polygon points="15,42 25,52 15,62" fill="#6366f1"/>
        <text x="30" y="58" font-family="monospace" font-size="9" fill="#6366f1">L</text>
        <!-- Right pointer -->
        <polygon points="175,42 165,52 175,62" fill="#f472b6"/>
        <text x="150" y="58" font-family="monospace" font-size="9" fill="#f472b6">R</text>
      </g>
      
      <g font-family="monospace" font-size="9" transform="translate(15, 115)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">twoSum</tspan>(nums, target):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># L,R converge</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">while</tspan> L < R:</text>
      </g>
    </g>
    
    <!-- Dynamic Programming -->
    <g class="pattern-card" transform="translate(520, 0)">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(244, 114, 182, 0.1)" stroke="#f472b6" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">Dynamic Programming</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">22 problems</text>
      
      <g transform="translate(15, 60)">
        <!-- DP Table visualization -->
        <g stroke="#f472b6" stroke-width="1" stroke-opacity="0.3">
          <rect x="0" y="0" width="200" height="60" rx="4" fill="#0f141b"/>
          <!-- Grid -->
          <line x1="40" y1="0" x2="40" y2="60"/>
          <line x1="80" y1="0" x2="80" y2="60"/>
          <line x1="120" y1="0" x2="120" y2="60"/>
          <line x1="160" y1="0" x2="160" y2="60"/>
          <line x1="0" y1="20" x2="200" y2="20"/>
          <line x1="0" y1="40" x2="200" y2="40"/>
        </g>
        <g font-family="monospace" font-size="9" fill="#f472b6">
          <text x="10" y="15">0</text>
          <text x="50" y="15">1</text>
          <text x="90" y="15">2</text>
          <text x="130" y="15">3</text>
          <text x="170" y="15">4</text>
          <text x="5" y="33">0</text>
          <text x="5" y="53">1</text>
        </g>
        <!-- Filled cells -->
        <rect x="42" y="22" width="36" height="16" fill="#f472b6" fill-opacity="0.3"/>
        <rect x="82" y="22" width="36" height="16" fill="#f472b6" fill-opacity="0.3"/>
        <rect x="122" y="22" width="36" height="16" fill="#f472b6" fill-opacity="0.3"/>
        <rect x="82" y="42" width="36" height="16" fill="#f472b6" fill-opacity="0.5"/>
      </g>
      
      <g font-family="monospace" font-size="9" transform="translate(15, 130)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">dp</tspan>(i, j):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># tabulation</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">return</tspan> dp[n][m]</text>
      </g>
    </g>
  </g>
  
  <!-- Second row -->
  <g transform="translate(50, 260)">
    <!-- Graph Algorithms -->
    <g class="pattern-card">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">Graph Algorithms</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">12 problems</text>
      
      <g transform="translate(15, 60)">
        <!-- Graph visualization -->
        <g fill="#fbbf24">
          <circle cx="40" cy="30" r="12"/>
          <circle cx="120" cy="30" r="12"/>
          <circle cx="80" cy="60" r="12"/>
          <circle cx="160" cy="60" r="12"/>
        </g>
        <g stroke="#fbbf24" stroke-width="2">
          <line x1="40" y1="42" x2="120" y2="42"/>
          <line x1="40" y1="30" x2="80" y2="60"/>
          <line x1="120" y1="30" x2="160" y2="60"/>
        </g>
        <g font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">
          <text x="40" y="35">A</text>
          <text x="120" y="35">B</text>
          <text x="80" y="65">C</text>
          <text x="160" y="65">D</text>
        </g>
      </g>
      
      <g font-family="monospace" font-size="9" transform="translate(15, 115)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">dijkstra</tspan>(graph, src):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># heap + visited</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">return</tspan> distances</text>
      </g>
    </g>
    
    <!-- Backtracking -->
    <g class="pattern-card" transform="translate(260, 0)">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(107, 114, 228, 0.1)" stroke="#6366f1" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#6366f1" text-anchor="middle">Backtracking</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">8 problems</text>
      
      <g transform="translate(15, 60)">
        <!-- Recursion tree -->
        <g stroke="#6366f1" stroke-width="1.5">
          <line x1="100" y1="10" x2="60" y2="40"/>
          <line x1="100" y1="10" x2="140" y2="40"/>
          <line x1="60" y1="40" x2="30" y2="70"/>
          <line x1="60" y1="40" x2="90" y2="70"/>
          <line x1="140" y1="40" x2="110" y2="70"/>
          <line x1="140" y1="40" x2="170" y2="70"/>
        </g>
        <g fill="#6366f1">
          <circle cx="100" cy="10" r="6"/>
          <circle cx="60" cy="40" r="6"/>
          <circle cx="140" cy="40" r="6"/>
          <circle cx="30" cy="70" r="5" fill-opacity="0.5"/>
          <circle cx="90" cy="70" r="5"/>
          <circle cx="110" cy="70" r="5" fill-opacity="0.5"/>
          <circle cx="170" cy="70" r="5"/>
        </g>
        <g font-family="monospace" font-size="7" fill="#6366f1" text-anchor="middle">
          <text x="100" y="15">[ ]</text>
          <text x="60" y="45">[1]</text>
          <text x="140" y="45">[2]</text>
          <text x="90" y="75">[1,3]</text>
        </g>
      </g>
      
      <g font-family="monospace" font-size="9" transform="translate(15, 115)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">backtrack</tspan>(path, choices):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># if valid: add</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">for</tspan> c <tspan fill="#ff79c6">in</tspan> choices:</text>
      </g>
    </g>
    
    <!-- Binary Search -->
    <g class="pattern-card" transform="translate(520, 0)">
      <rect x="0" y="0" width="230" height="180" rx="12" fill="rgba(0, 212, 170, 0.1)" stroke="#00d4aa" stroke-width="1"/>
      <text x="115" y="28" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#00d4aa" text-anchor="middle">Binary Search</text>
      <text x="115" y="48" font-family="monospace" font-size="9" fill="#6b7c93" text-anchor="middle">10 problems</text>
      
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="200" height="40" rx="4" fill="#0f141b" stroke="#00d4aa" stroke-width="1" stroke-opacity="0.3"/>
        <g font-family="monospace" font-size="11" fill="#f8f8f2">
          <text x="10" y="26">[1, 3, 5, 7, 9, 11, 13, 15]</text>
        </g>
        <!-- Mid pointer -->
        <polygon points="95,42 105,52 95,62" fill="#00d4aa"/>
        <text x="80" y="58" font-family="monospace" font-size="9" fill="#00d4aa">mid</text>
        <text x="115" y="58" font-family="monospace" font-size="9" fill="#6272a4">target: 9</text>
      </g>
      
      <g font-family="monospace" font-size="9" transform="translate(15, 115)" fill="#f8f8f2">
        <text x="0" y="0"><tspan fill="#bd93f9">def</tspan> <tspan fill="#50fa7b">binary_search</tspan>(arr, target):</text>
        <text x="20" y="18"><tspan fill="#6272a4"># L, R = 0, n-1</tspan></text>
        <text x="20" y="36"><tspan fill="#8be9fd">while</tspan> L <= R:</text>
      </g>
    </g>
  </g>
  
  <!-- Stats bar -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="700" height="30" rx="15" fill="rgba(0, 212, 170, 0.1)" stroke="#00d4aa" stroke-width="1"/>
    <text x="50" y="20" font-family="monospace" font-size="10" fill="#00d4aa">Total: 200+ Solutions</text>
    <text x="200" y="20" font-family="monospace" font-size="10" fill="#6366f1">Rust: 85 | C: 60 | Python: 55</text>
    <text x="500" y="20" font-family="monospace" font-size="10" fill="#fbbf24">★ 180 Stars | 🍴 25 Forks</text>
  </g>
  
  <!-- Language tabs -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="rgba(222, 165, 132, 0.2)" stroke="#dea584" stroke-width="1"/>
    <text x="60" y="20" font-family="monospace" font-size="10" fill="#dea584" text-anchor="middle">Rust</text>
    <rect x="130" y="0" width="80" height="30" rx="15" fill="rgba(168, 185, 204, 0.2)" stroke="#A8B9CC" stroke-width="1"/>
    <text x="170" y="20" font-family="monospace" font-size="10" fill="#A8B9CC" text-anchor="middle">C</text>
    <rect x="220" y="0" width="100" height="30" rx="15" fill="rgba(55, 118, 171, 0.2)" stroke="#3776AB" stroke-width="1"/>
    <text x="270" y="20" font-family="monospace" font-size="10" fill="#3776AB" text-anchor="middle">Python</text>
    <rect x="330" y="0" width="150" height="30" rx="15" fill="rgba(251, 191, 36, 0.2)" stroke="#fbbf24" stroke-width="1"/>
    <text x="405" y="20" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">by Pattern</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="45" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="600" fill="#f0f4f8" text-anchor="middle">LeetCode Solutions</text>
  <text x="400" y="70" font-family="monospace" font-size="11" fill="#6b7c93" text-anchor="middle">200+ Problems | Pattern-based | Multi-language</text>
  
  <!-- Tech tags -->
  <g font-family="monospace" font-size="9">
    <rect x="150" y="460" width="70" height="22" rx="11" fill="rgba(222, 165, 132, 0.15)" stroke="#dea584" stroke-width="1"/>
    <text x="185" y="475" fill="#dea584" text-anchor="middle">Rust</text>
    
    <rect x="230" y="460" width="50" height="22" rx="11" fill="rgba(168, 185, 204, 0.15)" stroke="#A8B9CC" stroke-width="1"/>
    <text x="255" y="475" fill="#A8B9CC" text-anchor="middle">C</text>
    
    <rect x="290" y="460" width="80" height="22" rx="11" fill="rgba(55, 118, 171, 0.15)" stroke="#3776AB" stroke-width="1"/>
    <text x="330" y="475" fill="#3776AB" text-anchor="middle">Python</text>
    
    <rect x="380" y="460" width="80" height="22" rx="11" fill="rgba(244, 114, 182, 0.15)" stroke="#f472b6" stroke-width="1"/>
    <text x="420" y="475" fill="#f472b6" text-anchor="middle">Algorithms</text>
    
    <rect x="470" y="460" width="90" height="22" rx="11" fill="rgba(69, 183, 209, 0.15)" stroke="#45B7D1" stroke-width="1"/>
    <text x="515" y="475" fill="#45B7D1" text-anchor="middle">DSA Patterns</text>
  </g>
</svg>